[project]
name = "gh-pages-sync"
version = "0.1.0"
description = "Mirror the latest published GitHub Pages content of a repo to a local directory for local deploy."
authors = [
    { name = "jamelouis", email = "jamelouis2015@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
gh-pages-sync = "gh_pages_sync:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true